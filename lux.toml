package = "Dualsense-games"
version = "0.1.0"
lua = "5.4"

[description]
summary = ""
maintainer = "meskill"
labels = [ "game" ]

[workspace]
members = [
    "glob:core/*",
    "glob:backends/*",
    "glob:engines/*/*",
    # lx check reports only members' src/ directories, so vendored type stubs in
    # engines/ue4ss/types stay out of the report; .luarc.json lists them in
    # workspace.library.
    "glob:games/*/*",
]

# [source]
# When publishing, configure the source URL here

[dependencies]

[run]
args = [ "src/main.lua" ]

[build]
type = "builtin"
