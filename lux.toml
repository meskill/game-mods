package = "Dualsense-games"
version = "0.1.0"
lua = "5.4"

[description]
summary = ""
maintainer = "meskill"
labels = [ "game" ]

[workspace]
members = [
    "glob:core/*",
    "glob:backends/*",
    # games/ue4ss/ue4ss is vendored UE4SS code, deliberately not a member: `lx check`
    # type checks every member and lux honours no ignore setting, so membership is the
    # only way to keep third-party sources out of the report. It is still consumed
    # through `workspace.library` in .luarc.json.
    "games/ue4ss/hogwarts-legacy",
]

# [source]
# When publishing, configure the source URL here

[dependencies]

[run]
args = [ "src/main.lua" ]

[build]
type = "builtin"
